name: 기능 제안
description: iPhone·iPad에서 개선할 기능이나 사용 흐름을 제안해주세요.
title: '[제안] '
body:
  - type: markdown
    attributes:
      value: |
        사용 중인 기능이 고장 났다면 오류 제보 양식을 이용해주세요.
        [현재 기능과 제한](https://github.com/p16481012/SillyTaevrn-ios#readme), [기존 이슈](https://github.com/p16481012/SillyTaevrn-ios/issues)를 먼저 확인해주세요. 모든 제안의 구현이나 일정을 약속할 수는 없습니다.

  - type: textarea
    id: problem
    attributes:
      label: 어떤 상황에서 필요한가요?
      description: 지금 겪는 불편과 영향을 받는 사용 흐름을 설명해주세요.
      placeholder: '예: iPad에서 … 작업을 할 때 … 때문에 불편합니다.'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작
      description: 기능을 사용하기 전과 후가 어떻게 달라지면 좋을지 적어주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 이미 시도한 방법·관련 자료
      description: 다른 설정이나 확장으로 해결해봤다면 결과를 알려주세요. 참고한 확장은 정확한 저장소 주소를 함께 적어주세요.

  - type: input
    id: environment
    attributes:
      label: 관련 환경
      description: 특정 환경에 필요한 기능이라면 기기, OS, 앱 버전·빌드 또는 API 제공자를 적어주세요. API 키는 제외해주세요.

  - type: dropdown
    id: testing
    attributes:
      label: 구현 후 시험에 참여할 수 있나요?
      options:
        - 실기기에서 확인할 수 있음
        - 시뮬레이터나 소스로 확인할 수 있음
        - 상황에 따라 가능함
        - 참여하기 어려움

  - type: checkboxes
    id: checks
    attributes:
      label: 제출 전 확인
      options:
        - label: 기존 이슈와 현재 제한을 확인했습니다.
          required: true
        - label: 설명과 첨부 자료에 API 키·인증 정보·개인 대화를 포함하지 않았습니다.
          required: true
